name: 기능 구현
description: 개발 계획서의 작업을 구현 가능한 단위로 작성합니다.
title: "[Feature] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: 사용자에게 생기는 변화
      description: 어떤 동작을 할 수 있게 되는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위와 선행 조건
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준과 검증 방법
      description: 실제로 확인할 수 있는 동작과 실패 상황을 적어 주세요.
    validations:
      required: true
