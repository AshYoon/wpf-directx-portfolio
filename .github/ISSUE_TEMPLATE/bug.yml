name: 오류 보고
description: 재현 절차와 실행 환경을 기록합니다.
title: "[Bug] "
body:
  - type: textarea
    id: repro
    attributes:
      label: 재현 순서
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 기대 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 커밋, Windows, CPU/GPU, 해상도, DPI, 빌드 구성을 적어 주세요.
  - type: textarea
    id: evidence
    attributes:
      label: 로그와 화면
      description: 로컬 경로와 접속 정보 등 불필요한 개인 정보를 제거해 주세요.
